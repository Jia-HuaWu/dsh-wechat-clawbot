# ============================================================================
# dsh-wechat-clawbot — DSH bundle patch
# ============================================================================
# 把「微信 ClawBot」插件插入 profile 的配置树。
#
# 安装方式（本地开发，link 安装）：
#   dsh plugin --profile desktop add link:<本插件目录的绝对路径>
#
# 安装后需要重启 DSH：宿主半边注册工具与监听、浏览器半边注册设置页，
# 两者的装配都发生在启动时（HMR 默认关闭）。
#
# 配置项：
#   enableTool  是否注册 wechat_send_message 工具用于主动推送（默认 true）
# ============================================================================

- insert:
    - id: dsh-wechat-clawbot
      name: dsh-wechat-clawbot
